<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyRAJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #021a0d 0%, #052e16 50%, #064e24 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(74, 222, 128, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
            animation: gradientMove 15s ease infinite;
            z-index: 0;
        }
        @keyframes gradientMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(5deg); }
        }
        .login-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.8s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-wrapper { position: relative; display: inline-block; margin-bottom: 25px; }
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: glow 3s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes glow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }
        .logo-wrapper img {
            width: 120px; height: auto;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.4));
        }
        .company-name {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .tagline { font-size: 12px; color: rgba(255, 255, 255, 0.6); letter-spacing: 2px; text-transform: uppercase; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255, 255, 255, 0.8); margin-bottom: 8px; font-size: 13px; font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: rgba(74, 222, 128, 0.6); font-size: 16px;
        }
        .form-group input {
            width: 100%; padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; color: #fff; font-size: 14px; font-family: inherit;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none; border-color: #4ade80; background: rgba(74, 222, 128, 0.05);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }
        
        .btn-login {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            border: none; border-radius: 10px; color: white;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(74, 222, 128, 0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .alert {
            padding: 12px 15px; border-radius: 10px; margin-bottom: 20px;
            display: none; align-items: center; gap: 10px; font-size: 13px;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .alert.show { display: flex; }
        .alert-error { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .footer { text-align: center; margin-top: 30px; color: rgba(255, 255, 255, 0.4); font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-wrapper">
                <img src="logo-raj.png" alt="CV REZEKI AMANAH JAYA" onerror="this.style.display='none'">
            </div>
            <h1 class="company-name">MyRAJ</h1>
            <p class="tagline">Money & Yield Rezeki Amanah Jaya</p>
        </div>

        <div id="alertContainer" class="alert alert-error">
            <i class="fa-solid fa-exclamation-circle"></i>
            <span id="alertMessage"></span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="admin@raj.com" required autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn-login" id="btnLogin">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Masuk ke Dashboard</span>
            </button>
        </form>

        <div class="footer">
            <p>&copy; 2026 CV Rezeki Amanah Jaya Group</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCd70zeLsmPYBHH1UdKkp4dlrKr57P73yk",
            authDomain: "ecotrack-184c2.firebaseapp.com",
            projectId: "ecotrack-184c2",
            storageBucket: "ecotrack-184c2.firebasestorage.app",
            messagingSenderId: "703447241523",
            appId: "1:703447241523:web:0841c9817537b0aa82a446"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 1. Jika sudah login, langsung lempar ke manajemen (mencegah loop)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'manajemen.html';
            }
        });

        // 2. Fungsi Login
        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btnLogin');
            const alertBox = document.getElementById('alertContainer');
            const alertMsg = document.getElementById('alertMessage');
            
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Memproses...</span>';
            alertBox.classList.remove('show');
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Jika berhasil, onAuthStateChanged di atas akan otomatis redirect ke manajemen.html
            } catch (error) {
                let message = 'Login gagal. Periksa email dan password Anda.';
                if (error.code === 'auth/user-not-found') message = 'Email tidak terdaftar di sistem.';
                else if (error.code === 'auth/wrong-password') message = 'Password yang Anda masukkan salah.';
                else if (error.code === 'auth/invalid-email') message = 'Format email tidak valid.';
                else if (error.code === 'auth/too-many-requests') message = 'Terlalu banyak percobaan. Silakan coba lagi nanti.';
                
                alertMsg.textContent = message;
                alertBox.classList.add('show');
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Masuk ke Dashboard</span>';
            }
        };
    </script>
</body>
</html>
